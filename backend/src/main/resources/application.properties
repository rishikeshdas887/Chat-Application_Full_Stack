spring.application.name=chat-backend

# PostgreSQL Database Connection (Configurable via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chat_application}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chat_app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

server.port=${SERVER_PORT:8081}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret Key (Configured via Environment Variable)
app.jwt.secret=${JWT_SECRET:YOUR_SECURE_JWT_SECRET_KEY_MINIMUM_256_BITS_FOR_PRODUCTION}

# TOTP Authenticator (RFC 6238 standard - Google Authenticator / Microsoft Authenticator / Authy)
# 100% Free Forever, Unlimited verifications, Zero telecom fees, No DLT required
app.auth.totp.issuer=SyncPulse

# File Attachment Storage
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-file-size=50MB
